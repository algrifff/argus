# Shared: deterministic security scans. Secrets in the PR's commits, risky code patterns, vulnerable dependencies.
name: security

on:
  workflow_call:
    inputs:
      semgrep-config:
        description: Semgrep rulesets, space-separated.
        type: string
        default: "p/default"
      audit-level:
        description: Fail on dependency vulnerabilities at or above this level (low, moderate, high, critical).
        type: string
        default: "high"

permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan this PR's commits
        env:
          RANGE: ${{ github.event.pull_request.base.sha && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --no-banner ${RANGE:+--log-opts="$RANGE"}

  sast:
    name: code patterns (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        env:
          CONFIGS: ${{ inputs.semgrep-config }}
        run: |
          set --
          for c in $CONFIGS; do set -- "$@" --config "$c"; done
          semgrep scan "$@" --error --metrics off

  dependencies:
    name: dependencies (audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit
        env:
          LEVEL: ${{ inputs.audit-level }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pm=$(node -p "require('./package.json').packageManager?.split('+')[0] ?? 'pnpm'")
            npx -y "$pm" audit --prod --audit-level "$LEVEL"
          elif [ -f package-lock.json ]; then
            npm audit --omit=dev --audit-level "$LEVEL"
          else
            echo "::notice::No Node lockfile, skipping dependency audit."
          fi
