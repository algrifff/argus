# Shared: Claude reviews the PR, once per agent brief, and posts all the reports as one comment.
# Advisory only. It never fails the PR because of what it finds.
#
# Briefs live in Argus at review-agents/<agent>.md. A reusable workflow only gets the
# caller's code, so this fetches the briefs itself, from `argus-repository` at `argus-ref`.
name: agent-review

on:
  workflow_call:
    inputs:
      agents:
        description: Comma-separated agent briefs to run, e.g. "security,adversarial".
        type: string
        default: "security,adversarial,standards"
      argus-repository:
        description: Where the briefs live. Pass "" to read them from the calling repo, which is how Argus tests a brief change on itself.
        type: string
        default: "algrifff/argus"
      argus-ref:
        description: Branch, tag or SHA of the briefs. Keep it in step with the @version in your `uses:` line. "" means the commit being checked.
        type: string
        default: "v1"
      model:
        description: Override every brief's model, e.g. to try a cheaper one. Empty uses each brief's own.
        type: string
        default: ""
      effort:
        description: Override every brief's effort (low, medium, high, xhigh, max). Empty uses each brief's own.
        type: string
        default: ""
      bun-version:
        description: Bun version for repos with a bun.lock or bun.lockb, e.g. "1.4".
        type: string
        default: "latest"
      extra-allowed-tools:
        description: Extra Claude Code tool rules for this repo, comma-separated, e.g. "Bash(cargo test:*)".
        type: string
        default: ""
      app-client-id:
        description: Client ID of a GitHub App to post the comment as, so it shows that app's name and avatar. Needs the ARGUS_APP_PRIVATE_KEY secret. Empty posts as github-actions.
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: From `claude setup-token`. Uses your Claude subscription. Set this or ANTHROPIC_API_KEY.
        required: false
      ANTHROPIC_API_KEY:
        description: Pays per token instead of using a subscription.
        required: false
      ARGUS_APP_PRIVATE_KEY:
        description: Private key of the GitHub App named by `app-client-id`.
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.split.outputs.agents }}
    steps:
      - id: split
        env:
          AGENTS: ${{ inputs.agents }}
        run: echo "agents=$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<< "$AGENTS")" >> "$GITHUB_OUTPUT"

  review:
    name: ${{ matrix.agent }}
    needs: plan
    # Reviews use your Claude plan's limits, so drafts wait until they're marked ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.agents) }}
    env:
      AGENT: ${{ matrix.agent }}
      REPORT: .argus-report.md
    steps:
      - name: Check for Claude credentials
        id: creds
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH$API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret, so the $AGENT review was skipped."
          fi

      - if: steps.creds.outputs.ok
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - if: steps.creds.outputs.ok
        name: Fetch the agent briefs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.argus-repository || github.repository }}
          ref: ${{ inputs.argus-ref || github.sha }}
          path: .argus
          sparse-checkout: review-agents
          persist-credentials: false

      - if: steps.creds.outputs.ok
        name: Build the prompt
        id: brief
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MODEL_OVERRIDE: ${{ inputs.model }}
          EFFORT_OVERRIDE: ${{ inputs.effort }}
        run: |
          brief=".argus/review-agents/$AGENT.md"
          if [ ! -f "$brief" ]; then
            available=$(for f in .argus/review-agents/[!_]*.md; do basename "$f" .md; done | paste -sd, -)
            echo "::error::No brief for agent \"$AGENT\". Available: $available"
            exit 1
          fi

          # Each brief starts with frontmatter naming the model, effort and turn limit it needs.
          field() { awk -v k="$1" 'NR==1 && $0!="---" {exit} NR>1 && $0=="---" {exit} NR>1 && index($0, k":")==1 {sub(/^[^:]*:[ \t]*/, ""); print; exit}' "$brief"; }
          model=${MODEL_OVERRIDE:-$(field model)}
          effort=${EFFORT_OVERRIDE:-$(field effort)}
          turns=$(field max-turns)
          if [ -z "$model" ] || [ -z "$effort" ]; then
            echo "::error::$brief needs \"model\" and \"effort\" in its frontmatter."
            exit 1
          fi
          case "$effort" in low|medium|high|xhigh|max) ;; *)
            echo "::error::$brief: effort must be low, medium, high, xhigh or max, not \"$effort\"."
            exit 1 ;;
          esac
          {
            echo "model=$model"
            echo "effort=$effort"
            echo "max-turns=${turns:-30}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$AGENT review: $model, effort $effort, up to ${turns:-30} turns."

          {
            echo "You are the \"$AGENT\" reviewer for pull request #$PR in $REPO."
            echo "Review what this PR changes: \`git diff $BASE...$HEAD\`. Read the surrounding code wherever you need context."
            echo "Ignore the \`.argus/\` folder; it holds these instructions, not the code under review."
            echo
            cat .argus/review-agents/_shared.md
            echo
            echo "## Your brief"
            echo
            awk 'NR==1 && $0=="---" {fm=1; next} fm && $0=="---" {fm=0; next} !fm' "$brief"
          } > "$RUNNER_TEMP/prompt.md"
          {
            echo 'PROMPT<<ARGUS_EOF'
            cat "$RUNNER_TEMP/prompt.md"
            echo 'ARGUS_EOF'
          } >> "$GITHUB_ENV"

      # Dependencies let the agent run the repo's tests, including tests it writes to prove a finding.
      - if: steps.creds.outputs.ok && hashFiles('bun.lock', 'bun.lockb') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - if: steps.creds.outputs.ok && hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.creds.outputs.ok && hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - if: steps.creds.outputs.ok && hashFiles('package.json') != ''
        name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi

      - if: steps.creds.outputs.ok
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ env.PROMPT }}
          claude_args: >-
            --model ${{ steps.brief.outputs.model }}
            --effort ${{ steps.brief.outputs.effort }}
            --max-turns ${{ steps.brief.outputs.max-turns }}
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(pnpm test:*),Bash(pnpm exec vitest:*),Bash(pnpm typecheck:*),Bash(npm test:*),Bash(npx vitest:*),Bash(bun test:*),Bash(bun run test:*),Bash(bun run typecheck:*)${{ inputs.extra-allowed-tools && format(',{0}', inputs.extra-allowed-tools) || '' }}"

      - if: always() && steps.creds.outputs.ok
        name: Save the report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          if [ -s "$REPORT" ]; then cp "$REPORT" "$RUNNER_TEMP/report/$AGENT.md"
          else echo "No report. See the [run log]($RUN_URL)." > "$RUNNER_TEMP/report/$AGENT.md"; fi
      - if: always() && steps.creds.outputs.ok
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argus-report-${{ matrix.agent }}
          path: ${{ runner.temp }}/report/
          retention-days: 1

  # Every agent's report goes into one comment, edited on each push instead of piling up.
  comment:
    needs: [plan, review]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: argus-report-*
          path: reports
          merge-multiple: true

      # Posting as a GitHub App shows its name and avatar instead of github-actions.
      - if: inputs.app-client-id != '' && hashFiles('reports/*.md') != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post the comment
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          AGENTS: ${{ needs.plan.outputs.agents }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! compgen -G "reports/*.md" > /dev/null; then
            echo "::notice::No reports, so nothing to post."
            exit 0
          fi

          marker="<!-- argus -->"
          {
            echo "$marker"
            while read -r agent; do
              [ -f "reports/$agent.md" ] || continue
              printf '**%s:** %s\n\n' "$agent" "$(cat "reports/$agent.md")"
            done < <(jq -r '.[]' <<< "$AGENTS")
            echo "<sub>[Run log]($RUN_URL) · ${HEAD::7}</sub>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          body=$(jq -Rs '{body: .}' < comment.md)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" --input - <<< "$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" --input - <<< "$body" > /dev/null
          fi
