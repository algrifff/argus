# Shared: runs a Node repo's own package.json scripts, one check per script.
# Scripts the repo doesn't define are skipped, so each repo picks its own tools.
name: node-checks

on:
  workflow_call:
    inputs:
      scripts:
        description: JSON list of package.json scripts to run, each as its own check.
        type: string
        default: '["typecheck", "lint", "test", "build"]'
      node-version:
        type: string
        default: "24"
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  run:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(inputs.scripts) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find package manager and script
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ]; then pm=pnpm lock=pnpm-lock.yaml
          elif [ -f yarn.lock ]; then pm=yarn lock=yarn.lock
          else pm=npm lock=package-lock.json; fi
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "lockfile=$lock" >> "$GITHUB_OUTPUT"
          if node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "${{ matrix.script }}"; then
            echo "has-script=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No \"${{ matrix.script }}\" script in package.json, skipping."
          fi

      - if: steps.detect.outputs.has-script && steps.detect.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - if: steps.detect.outputs.has-script
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.detect.outputs.pm }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.detect.outputs.lockfile }}

      - if: steps.detect.outputs.has-script
        name: Install
        run: |
          case "${{ steps.detect.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac

      - if: steps.detect.outputs.has-script
        name: ${{ matrix.script }}
        run: ${{ steps.detect.outputs.pm }} run ${{ matrix.script }}
